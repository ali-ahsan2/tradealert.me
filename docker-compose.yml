services:
  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_FIND_LINKS: ${PIP_FIND_LINKS:-}
    restart: unless-stopped
    environment: &app_env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      AWS_REGION: ${AWS_REGION}
      SES_VERIFIED_SENDER: ${SES_VERIFIED_SENDER}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY}
      BILLING_DEV_MODE: ${BILLING_DEV_MODE:-}
      OAUTH_DEV_MODE: ${OAUTH_DEV_MODE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID_free: ${STRIPE_PRICE_ID_free}
      STRIPE_PRICE_ID_basic: ${STRIPE_PRICE_ID_basic}
      STRIPE_PRICE_ID_pro: ${STRIPE_PRICE_ID_pro}
      STRIPE_PRICE_ID_investor: ${STRIPE_PRICE_ID_investor}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM: ${TWILIO_FROM}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/openapi.json', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Scheduled ingest and delivery. Same image as app; only the command
  # differs, so a deploy updates both from one build.
  worker:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_FIND_LINKS: ${PIP_FIND_LINKS:-}
    restart: unless-stopped
    environment:
      <<: *app_env
      PRICES_REFRESH_HOURS: ${PRICES_REFRESH_HOURS:-6}
      EVENTS_REFRESH_HOURS: ${EVENTS_REFRESH_HOURS:-12}
      ALERTS_SWEEP_MINUTES: ${ALERTS_SWEEP_MINUTES:-15}
      DIGEST_HOUR_UTC: ${DIGEST_HOUR_UTC:-13}
      HOUSEKEEP_HOURS: ${HOUSEKEEP_HOURS:-24}
      DISK_WARN_PCT: ${DISK_WARN_PCT:-75}
      DISK_CRIT_PCT: ${DISK_CRIT_PCT:-88}
      BARS_RETENTION_DAYS: ${BARS_RETENTION_DAYS:-1100}
      OPS_EMAIL: ${OPS_EMAIL:-}
      ALERT_FILE: /var/log/tradealert/alerts.log
    volumes:
      # Alerts land on the host so a disk warning survives the container and
      # can be tailed or mailed even when SES is not configured.
      - ./logs:/var/log/tradealert
    # Migrations are the app container's job; the worker only reads a schema
    # that is already there.
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: