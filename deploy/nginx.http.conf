# nginx on the EC2 host, HTTP phase (before DNS/TLS are live).
# Mirrors deploy/nginx.conf but without TLS or HSTS, and adds gzip and an
# upstream keepalive so a page load does not open a fresh app connection
# for every asset. When TLS arrives, supersede this with deploy/nginx.conf.

upstream tradealert_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name tradealert.me;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml text/xml application/xml application/xml+rss;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://tradealert_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control no-store always;
    }

    location = /lab {
        root /opt/tradealert.me/static;
        try_files /lab.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /index.html {
        root /opt/tradealert.me/static;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control no-store always;
    }

    location /assets/ {
        root /opt/tradealert.me/static;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /opt/tradealert.me/static;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }
}