# nginx on the EC2 host, not in Docker. TLS via certbot (Let's Encrypt).
# Replace DOMAIN and the static root, then:  sudo nginx -t && sudo nginx -s reload

server {
    listen 80;
    server_name DOMAIN;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name DOMAIN;

    # created by:  sudo certbot --nginx -d DOMAIN
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    client_max_body_size 2m;

    # Note: a location with ITS OWN add_header drops every server-level
    # add_header, so these are repeated per location on purpose.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control no-store always;
    }

    # The Lab (admin strategy analysis) is a separate bundle. The product
    # authenticates with a bearer token in localStorage, which top-level
    # navigations cannot send, so an nginx auth_request would block legitimate
    # admins on first load. The boundary lives in the API: every /api/admin/*
    # route returns a uniform 404 to anonymous and non-admin clients, and the
    # bundle itself re-checks /api/admin/_check before rendering. Here we only
    # keep the page out of caches and indexes.
    location = /lab {
        root /opt/tradealert.me/static;
        try_files /lab.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control no-store always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # index.html must never be cached: a cached copy pins visitors to old
    # hashed bundles that a deploy may have pruned.
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control no-store always;
    }

    # hashed build assets are immutable: cache for a year, no revalidation.
    location /assets/ {
        root /opt/tradealert.me/static;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /opt/tradealert.me/static;
        try_files $uri $uri/ /index.html;
        # editables (tokens.css, theme-override.css) propagate within minutes;
        # index.html is handled by the exact-match location above.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }
}